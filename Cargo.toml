[workspace]
resolver = "3"
members = ["core", "crates/keybinds/keybinds", "crates/keybinds/keybinds_gateway", "crates/levels/level", "crates/levels/level_gateway", "crates/levels/level_utils", "crates/mechanics/bag/bag", "crates/mechanics/bag/bag_gateway", "crates/mechanics/interaction/interaction", "crates/mechanics/interaction/interaction_gateway", "crates/menus/menus", "crates/menus/menus_gateway", "crates/player/player", "crates/player/player_gateway", "crates/third_parties", "crates/utils/utils"]


[workspace.dependencies]
bevy = "0.19"
bevy_skein = "0.6"

# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

avian3d = "0.7.0"
bevy_enhanced_input = "0.26"
bevy_ahoy = "0.2.0"
bevy_trenchbroom = {version = "0.14.0", features = ["avian_f32"]}
# bevy_trenchbroom_avian = "0.12.0"

## Local Crates

level = { path = "./crates/levels/level" }
level_gateway = { path = "./crates/levels/level_gateway" }
level_utils = { path = "./crates/levels/level_utils/" }

player = {path = "./crates/player/player"}
player_gateway = {path = "./crates/player/player_gateway"}

third_parties = { path = "./crates/third_parties" }

keybinds = {path = "./crates/keybinds/keybinds"}

interaction = { path = "./crates/mechanics/interaction/interaction" }
interaction_gateway = { path = "./crates/mechanics/interaction/interaction_gateway" }

utils = { path = "./crates/utils/utils" }

bag = { path = "./crates/mechanics/bag/bag" }
bag_gateway = { path = "./crates/mechanics/bag/bag_gateway" }

[workspace.lints.clippy]

# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"

# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
